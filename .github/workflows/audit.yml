name: Security Audit

on:
  push:
    paths: 
      - '**/package.json'
      - '**/bun.lock'
  pull_request:
    paths: 
      - '**/package.json'
      - '**/bun.lock'
  schedule:
    - cron: '0 0 * * *'

jobs:
  audit:
    strategy:
      matrix:
        app: ["fronted"]

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run security audit - front
        run: |
          cd ${{ matrix.app }}
          bun audit
